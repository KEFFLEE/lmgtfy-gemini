<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>תן לי לג'מנן לך</title>
<meta name="description" content="למי שלא מצא זמן לשאול את ג'מיני בעצמו">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Secular+One&family=Assistant:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap">
<style>
  [hidden]{display:none!important}
/* Layout: one centered "stage" — a prompt bar the visitor watches being filled in, with a caption strip underneath */
:root{
  --bg:#f3f4fb; --surface:#ffffff; --ink:#1b1d33; --muted:#686b8a;
  --line:#dcdef0; --accent:#4b5ce8; --accent-2:#b04be8; --ok:#1f9d6b;
  --display:"Secular One","Assistant",system-ui,sans-serif;
  --body:"Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#12131f; --surface:#1c1e2f; --ink:#ecedf8; --muted:#9a9cba;
  --line:#2e3049; --accent:#7f8cff; --accent-2:#cf86ff; --ok:#4fd19c;
  color-scheme:dark;
}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--body);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding-inline:16px;padding-block:32px}
main{width:100%;max-width:680px;display:flex;flex-direction:column;gap:28px;align-items:stretch}
h1{font:400 clamp(30px,6vw,46px)/1.15 var(--display);margin:0;text-align:center;text-wrap:balance}
h1 .grad{background:linear-gradient(90deg,var(--accent),var(--accent-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin:-14px 0 0;text-align:center;color:var(--muted)}

.bar{position:relative;display:flex;align-items:center;gap:10px;background:var(--surface);
  border:1.5px solid var(--line);border-radius:28px;padding:10px 10px 10px 18px;
  box-shadow:0 6px 24px rgb(40 44 100 / .08);transition:border-color .2s,box-shadow .2s}
.bar:focus-within,.bar.active{border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.spark{flex:none;width:26px;height:26px;margin-inline-start:6px}
.bar input,.bar .typed{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);
  font:400 19px/1.4 var(--body);padding:8px 4px;unicode-bidi:plaintext}
.typed{white-space:nowrap;overflow:hidden;text-overflow:clip}
.typed:empty::before{content:attr(data-ph);color:var(--muted)}
.caret{display:inline-block;width:2px;height:1.1em;background:var(--accent);vertical-align:-3px;margin-inline:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.send{flex:none;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;display:grid;place-items:center;
  transition:transform .15s}
.send:hover{transform:scale(1.06)}
.send:focus-visible,.btn:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.send.pressed{transform:scale(.88)}
.send svg{transform:scaleX(-1)}

.result{display:flex;flex-direction:column;gap:12px;background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:18px}
.result label{font-size:13px;letter-spacing:.04em;color:var(--muted);font-weight:600}
.linkrow{display:flex;gap:8px;flex-wrap:wrap}
.linkrow input{flex:1 1 260px;min-width:0;font:400 14px/1.4 var(--mono);direction:ltr;text-align:left;
  padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.btn{font:600 15px var(--body);padding:10px 18px;border-radius:10px;border:1px solid var(--line);
  background:var(--bg);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.hint{font-size:14px;color:var(--muted);margin:0}
.hint.ok{color:var(--ok)}

/* playback */
.caption{min-height:3.2em;text-align:center;font:400 clamp(20px,4vw,26px)/1.4 var(--display);text-wrap:balance}
.step{display:inline-block;font:600 13px var(--body);letter-spacing:.06em;color:var(--accent);
  border:1px solid currentColor;border-radius:99px;padding:2px 10px;margin-inline-end:8px;vertical-align:4px}
#cursor{position:fixed;top:0;left:0;width:26px;height:26px;pointer-events:none;z-index:10;
  transition:transform 1.1s cubic-bezier(.45,.05,.3,1);filter:drop-shadow(0 2px 3px rgb(0 0 0 / .35))}
.foot{text-align:center;font-size:13px;color:var(--muted)}
.foot a{color:inherit}
@media (prefers-reduced-motion:reduce){#cursor{transition:none}.caret{animation:none}}
</style>
</head>
<body>
<main id="app">
  <h1>תן לי <span class="grad">לג'מנן</span> לך</h1>
  <p class="sub" id="sub">כתבו את השאלה, קבלו קישור, ושלחו למי שהיה צריך פשוט לשאול בעצמו.</p>

  <!-- Generator -->
  <form class="bar" id="genForm" autocomplete="off">
    <svg class="spark" viewBox="0 0 24 24" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--accent)"/><stop offset="1" stop-color="var(--accent-2)"/></linearGradient></defs><path fill="url(#g)" d="M12 2c.6 5.2 4.8 9.4 10 10-5.2.6-9.4 4.8-10 10-.6-5.2-4.8-9.4-10-10 5.2-.6 9.4-4.8 10-10z"/></svg>
    <input id="q" dir="auto" placeholder="מה רצית לשאול?" aria-label="השאלה">
    <button class="send" type="submit" aria-label="צור קישור"><svg width="20" height="20" viewBox="0 0 24 24"><path fill="currentColor" d="M3 11h13.2l-4.6-4.6L13 5l7 7-7 7-1.4-1.4 4.6-4.6H3z"/></svg></button>
  </form>

  <div class="result" id="result" hidden>
    <label for="link">הקישור שלך</label>
    <div class="linkrow">
      <input id="link" readonly>
      <button class="btn primary" id="copy" type="button">העתק</button>
      <a class="btn" id="preview" target="_blank" rel="noopener">תצוגה מקדימה</a>
    </div>
    <p class="hint" id="hint">מי שיפתח את הקישור יראה את השאלה מוקלדת, ואז יעבור לג'מיני.</p>
  </div>

  <!-- Playback -->
  <div class="caption" id="caption" hidden></div>
  <p class="foot" id="foot">לא קשור ל-Google. פשוט קיצור דרך עם קצת עוקצנות.</p>
</main>

<svg id="cursor" viewBox="0 0 24 24" hidden aria-hidden="true"><path d="M4 2l15 11-6.5 1.2L16.8 22l-3 1.3-4.2-7.9L4 20z" fill="#fff" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/></svg>

<script>
// Where to send the visitor. Gemini's Guided Learning page accepts a ?query= prefill.
// To use the regular chat instead, change to: q => 'https://gemini.google.com/app'
const GEMINI_URL = q => 'https://gemini.google.com/guided-learning?query=' + encodeURIComponent(q);

const $ = id => document.getElementById(id);
const params = new URLSearchParams(location.search);
const question = (params.get('q') || '').trim();

if (question) playback(question); else generator();

function generator(){
  $('q').focus();
  $('genForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('q').value.trim();
    if (!v){ $('q').focus(); return; }
    const url = location.origin + location.pathname + '?q=' + encodeURIComponent(v);
    $('link').value = url;
    $('preview').href = url;
    $('result').hidden = false;
    $('hint').className = 'hint';
    $('hint').textContent = 'מי שיפתח את הקישור יראה את השאלה מוקלדת, ואז יעבור לג\'מיני.';
  });
  $('copy').addEventListener('click', () => {
    const done = () => { $('hint').className = 'hint ok'; $('hint').textContent = 'הועתק. עכשיו רק להדביק ולשלוח.'; };
    navigator.clipboard?.writeText($('link').value).then(done).catch(() => { $('link').select(); document.execCommand('copy') && done(); }) ?? ($('link').select(), document.execCommand('copy'), done());
  });
}

function playback(q){
  document.title = 'רגע, אני מראה לך';
  $('sub').hidden = true; $('foot').hidden = true;
  // swap the input for a display span we "type" into
  const input = $('q');
  const span = document.createElement('div');
  span.className = 'typed'; span.dir = 'auto'; span.dataset.ph = input.placeholder;
  input.replaceWith(span);
  const form = $('genForm');
  form.addEventListener('submit', e => e.preventDefault());
  const send = form.querySelector('.send');
  const cap = $('caption'); cap.hidden = false;
  const cur = $('cursor');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms, 300) : ms));
  const say = (n, t) => cap.innerHTML = (n ? `<span class="step">שלב ${n}</span>` : '') + t;
  const moveTo = el => {
    const r = el.getBoundingClientRect();
    cur.style.transform = `translate(${r.left + r.width/2}px, ${r.top + r.height/2}px)`;
  };

  (async () => {
    cur.style.transform = `translate(${innerWidth*0.15}px, ${innerHeight*0.85}px)`;
    cur.hidden = false;
    say(1, 'לוחצים על התיבה');
    await wait(500);
    moveTo(span); await wait(1200);
    form.classList.add('active');
    const caret = document.createElement('span'); caret.className = 'caret';
    span.append(caret);
    say(2, 'מקלידים את השאלה');
    const text = document.createTextNode('');
    span.insertBefore(text, caret);
    for (const ch of q){
      text.data += ch;
      span.scrollLeft = span.dir === 'rtl' ? -span.scrollWidth : span.scrollWidth;
      await wait(reduce ? 0 : 45 + Math.random()*70);
    }
    await wait(600);
    say(3, 'לוחצים על שליחה');
    moveTo(send); await wait(1200);
    send.classList.add('pressed'); await wait(180); send.classList.remove('pressed');
    caret.remove();
    say(0, 'זה היה כל כך קשה?');
    await wait(1700);
    cur.hidden = true; say(0, 'זה היה כל כך קשה?<br><small style="display:block;font:16px var(--body);color:var(--muted)">לחצו, השאלה תועתק, והדביקו בג׳מיני עם Ctrl+V</small>'); const go = document.createElement('button'); go.className = 'btn primary'; go.style.cssText = 'align-self:center;font-size:17px;padding:14px 26px;border-radius:99px'; go.textContent = 'פתחו את ג׳מיני'; cap.after(go); go.focus(); go.onclick = () => { navigator.clipboard?.writeText(q).catch(() => {}); window.open('https://gemini.google.com/app', '_blank'); go.textContent = 'הועתק. הדביקו בג׳מיני עם Ctrl+V'; };
  })();
}
</script>
</body>
</html>
